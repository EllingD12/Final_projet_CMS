{% load wagtailcore_tags %}
{% with parent=page.get_parent %}
  {% if parent and parent.depth > 1 %}
    <div class="retour-barre">
      <div class="retour-barre__inner">
        <a class="bouton" href="{% pageurl parent %}">← Retour à {{ parent.title }}</a>
      </div>
    </div>
  {% endif %}
{% endwith %}
