{% extends "base.html" %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block body_class %}template-apropos{% endblock %}

{% block content %}
<div class="section section--claire">
  <div class="section__inner apropos">

    {% if page.image %}
      {% image page.image width-800 as img %}
      <img class="apropos__image"
           src="{{ img.url }}" width="{{ img.width }}" height="{{ img.height }}"
           alt="{{ page.image.title }}">
    {% endif %}

    <div class="apropos__texte">
      <h2 class="apropos__titre">{{ page.title }}</h2>
      {{ page.paragraphe|richtext }}
    </div>

  </div>
</div>
{% endblock content %}
